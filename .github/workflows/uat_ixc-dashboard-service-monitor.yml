# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ixc-dashboard-service-monitor

on:
  push:
    branches:
      - uat
  workflow_dispatch:

env:
  NODE_ENV: production

jobs:
  # ✅ PASO 1: BUILD - Compilación de la aplicación
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Remove package-lock.json
        run: rm -rf package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Debug dist structure
        run: |
          echo "=== Dist directory structure ==="
          ls -la dist/
          echo "=== Dist/server directory structure ==="
          ls -la dist/server/ || echo "No server directory found"
          echo "=== Current directory structure ==="
          find . -name "*.mjs" -o -name "*.js" | head -10

      - name: Copy server.js to dist
        run: cp server.js dist/server.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json
            server.js

  # ✅ PASO 2: CREATE-ZIP - Creación del paquete de despliegue
  create-zip:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Create deployment package
        run: |
          # Debug: Check what files we have
          echo "=== Files before packaging ==="
          ls -la
          echo "=== Dist contents ==="
          ls -la dist/
          echo "=== Server contents ==="
          ls -la dist/server/ || echo "No server directory"
          
          # Create deployment directory structure
          mkdir -p deployment
          cp -r dist/* deployment/
          cp package.json package-lock.json deployment/
          mv node_modules/ deployment/
          cp server.js deployment/
          
          cd deployment
          
          # Debug: Check what files we have in deployment
          echo "=== Files in deployment directory ==="
          ls -la
          echo "=== Server contents in deployment ==="
          ls -la server/ || echo "No server directory in deployment"
          
          # Update port configuration for Azure App Service
          if [ -f "server/entry.mjs" ]; then
            sed -i 's/"port": 4321/"port": process.env.PORT || 8080/' server/entry.mjs
            echo "Port configuration updated in server/entry.mjs"
            
            # Fix absolute paths in entry.mjs for Azure deployment
            sed -i 's|"file:///.*/dist/client/"|"./client/"|g' server/entry.mjs
            sed -i 's|"file:///.*/dist/server/"|"./server/"|g' server/entry.mjs
            echo "Absolute paths fixed in server/entry.mjs"
          else
            echo "WARNING: server/entry.mjs not found!"
            find . -name "*.mjs" -o -name "*.js" | head -5
          fi
          
          # Create web.config for Azure App Service
          cat > web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NodeInspector" patternSyntax="ECMAScript" stopProcessing="true">
                    <match url="^server.js\/debug[\/]?" />
                  </rule>
                  <rule name="StaticContent">
                    <action type="Rewrite" url="public{REQUEST_URI}"/>
                  </rule>
                  <rule name="DynamicContent">
                    <conditions>
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True"/>
                    </conditions>
                    <action type="Rewrite" url="server.js"/>
                  </rule>
                </rules>
              </rewrite>
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <remove segment="bin"/>
                  </hiddenSegments>
                </requestFiltering>
              </security>
              <httpErrors existingResponse="PassThrough" />
            </system.webServer>
          </configuration>
          EOF
          
          # Create the deployment package
          zip -r ../app.zip .
          cd ..

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: app.zip

  # ✅ PASO 3: DEPLOY - Despliegue a Azure App Service
  deploy:
    runs-on: ubuntu-latest
    needs: create-zip
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_513ABFB0C8BC45D7A57BD65EA90F56EB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F08A4B3E197843FF9A5EF726042AC8EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0705F868163F4B06B460201FA9806DFB }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ixc-dashboard-service-monitor'
          slot-name: 'Production'
          package: ./app.zip
          